<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 class="title">Dashboard</h1>
        <button class="focus">Focus Mode</button>
    </header>
    <main class="Dash">
        <h2 class="clock">01:22</h2>

        <label for="search-engine">Choisir un moteur de recherche</label>
        <select name="Search" id="search-engine">
            <option value="https://www.google.com/">Google</option>
            <option value="https://duckduckgo.com/">DuckDuckGo</option>
            <option value="https://www.ecosia.org/">Ecosia</option>
        </select>
        <label for="search-bar">Rechercher</label>
        <input type="text" id="search-bar">
        <section class="cards">
            <div class="card1">
                <h3>Dev link</h3>
                <button class="add">Add link</button>
            </div>
            <div class="card2">
                <h3>Work link</h3>
                <button class="add">Add link</button>
            </div>
            <div class="card3">
                <h3>Free-time link</h3>
                <button class="add">Add link</button>
            </div>
            <div class="card4">
                <h3>idk link</h3>
                <button class="add">Add link</button>
            </div>
        </section>
        <button class="bg-add">Import a Background</button>
        <button class="bg-remove">Remove Background</button>
    </main>
    <main class="keep">
        <button class="add">Add Note</button>
        <div class="note">
            <h1 class="title" contenteditable="true"></h1>
            <p class="contenu" contenteditable="true"></p>
            <button class="end">End</button>
            <button class="delete">Delete</button>
        </div>
    </main>
</body>

</html>
